name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, types, docs, and package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=low
      - name: Pack the tested release artifact
        run: mkdir -p artifact && npm pack --ignore-scripts --pack-destination artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Node ${{ matrix.node }} runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [12, 14, 16, 18, 20, 22.23.4, 24.22.2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --omit=dev --ignore-scripts
      - run: npm run test:runtime

  typescript-39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2
      - run: npm install --ignore-scripts
      - run: node node_modules/typescript-3-9/bin/tsc -p test/types/tsconfig.legacy.json

  platform:
    name: ${{ matrix.os }} loader behavior
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.2
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run test:upstream
      - run: npm run test:compatibility
      - run: npm run test:esm
